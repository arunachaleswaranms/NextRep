name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only: the workflow never writes to the repository.
permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  quality:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Migration tests (schema v1 -> v2 -> v3 -> v4 -> v5)
        run: >-
          flutter test
          test/data/migration_test.dart
          test/data/migration_v3_test.dart
          test/data/migration_v4_test.dart
          test/data/migration_v5_test.dart

      - name: Backup format tests (v1 compatibility and v2)
        run: >-
          flutter test
          test/domain/backup_format_test.dart
          test/domain/backup_v2_test.dart
          test/data/backup_restore_test.dart
          test/data/backup_v2_restore_test.dart

      - name: Release qualification tests (lifecycle, accessibility, dates)
        run: >-
          flutter test
          test/app/day_change_test.dart
          test/domain/date_edges_test.dart
          test/features/phase7_lifecycle_test.dart
          test/features/phase7_accessibility_test.dart

      - name: All tests
        run: flutter test

  android:
    name: Android builds and permission audit
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      # A compile check only. The release build type is signed with the
      # runner's throwaway debug key: no signing secret exists in CI, and
      # this artifact is never published.
      - name: Build release APK
        run: flutter build apk --release

      - name: Release permission audit
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$AAPT2" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee permissions.txt
          for forbidden in INTERNET SCHEDULE_EXACT_ALARM USE_EXACT_ALARM \
            MANAGE_EXTERNAL_STORAGE READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE; do
            if grep -q "android.permission.$forbidden'" permissions.txt; then
              echo "::error::Release APK requests android.permission.$forbidden"
              exit 1
            fi
          done
