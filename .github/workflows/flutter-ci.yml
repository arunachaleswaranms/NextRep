name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only: the workflow never writes to the repository.
permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  quality:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Migration tests (schema v1 -> v2 -> v3 -> v4 -> v5 -> v6)
        run: >-
          flutter test
          test/data/migration_test.dart
          test/data/migration_v3_test.dart
          test/data/migration_v4_test.dart
          test/data/migration_v5_test.dart
          test/data/migration_v6_test.dart

      - name: Backup format tests (write 3; read 1, 2 and 3)
        run: >-
          flutter test
          test/domain/backup_format_test.dart
          test/domain/backup_v2_test.dart
          test/data/backup_restore_test.dart
          test/data/backup_v2_restore_test.dart
          test/data/backup_v3_test.dart

      - name: Focus Guard tests (settings, usage, one nudge a day, restore)
        run: >-
          flutter test
          test/domain/focus_guard_test.dart
          test/domain/focus_guard_service_test.dart
          test/data/focus_guard_codec_test.dart
          test/data/focus_guard_persistence_test.dart
          test/features/phase11c_focus_guard_flow_test.dart

      - name: Manual update check tests (versions, release validation, manual-only network)
        run: >-
          flutter test
          test/domain/release_version_test.dart
          test/domain/update_checker_test.dart
          test/data/github_release_feed_test.dart
          test/features/phase11d_about_flow_test.dart
          test/app/network_boundary_test.dart
          test/app/app_routes_test.dart

      - name: Release qualification tests (lifecycle, accessibility, dates)
        run: >-
          flutter test
          test/app/day_change_test.dart
          test/domain/date_edges_test.dart
          test/features/phase7_lifecycle_test.dart
          test/features/phase7_accessibility_test.dart

      - name: All tests
        run: flutter test

  android:
    name: Android builds and permission audit
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      # A compile check only. The release build type is signed with the
      # runner's throwaway debug key: no signing secret exists in CI, and
      # this artifact is never published.
      - name: Build release APK
        run: flutter build apk --release

      # Focus Guard's native logic on the JVM: the UsageStats event
      # calculation, the background check, and its SQL against a real
      # SQLite with Drift's schema (claims, concurrency, restore).
      - name: Native Android tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Release permission audit
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          # INTERNET is expected (below): only the manual update check uses it.
          for forbidden in SCHEDULE_EXACT_ALARM USE_EXACT_ALARM \
            MANAGE_EXTERNAL_STORAGE READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE \
            READ_MEDIA_IMAGES READ_MEDIA_VIDEO READ_MEDIA_AUDIO READ_MEDIA_VISUAL_USER_SELECTED \
            READ_CONTACTS WRITE_CONTACTS GET_ACCOUNTS CAMERA RECORD_AUDIO \
            QUERY_ALL_PACKAGES SYSTEM_ALERT_WINDOW REQUEST_INSTALL_PACKAGES FOREGROUND_SERVICE \
            ACCESS_NETWORK_STATE; do
            if grep -q "android.permission.$forbidden'" permissions.txt; then
              echo "::error::Release APK requests android.permission.$forbidden"
              exit 1
            fi
          done
          # Exactly the expected set: the manual update check's INTERNET,
          # reminders (boot, vibrate, notifications, the app-private receiver
          # permission), Focus Guard's Usage Access and WorkManager's
          # WAKE_LOCK. Anything else fails.
          sed -nE "s/^uses-permission(-sdk-23)?: name='([^']*)'.*/\2/p" permissions.txt | sort -u > declared.txt
          printf '%s\n' \
            android.permission.INTERNET \
            android.permission.RECEIVE_BOOT_COMPLETED \
            android.permission.VIBRATE \
            android.permission.POST_NOTIFICATIONS \
            android.permission.PACKAGE_USAGE_STATS \
            android.permission.WAKE_LOCK \
            com.nextrep.nextrep.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION | sort -u > expected.txt
          if ! diff expected.txt declared.txt; then
            echo "::error::Release APK permissions differ from the expected set"
            exit 1
          fi
          # No Accessibility, VPN or notification listener service, and no
          # foreground service, may be declared at all.
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          for bind in BIND_ACCESSIBILITY_SERVICE BIND_VPN_SERVICE BIND_NOTIFICATION_LISTENER_SERVICE; do
            if grep -q "android.permission.$bind" manifest.txt; then
              echo "::error::Release APK declares a service guarded by $bind"
              exit 1
            fi
          done
          if grep -qE "SystemForegroundService|foregroundServiceType" manifest.txt; then
            echo "::error::Release APK declares a foreground service"
            exit 1
          fi
          # Official pages open in the user's browser only: url_launcher's
          # in-app WebView is removed.
          if grep -q "WebViewActivity" manifest.txt; then
            echo "::error::Release APK declares an in-app WebView activity"
            exit 1
          fi
          # Focus Guard's background check is there and private.
          if ! grep -q "FocusGuardCheckProvider" manifest.txt; then
            echo "::error::Release APK lacks Focus Guard's background check"
            exit 1
          fi
          if awk '/E: /{p=0} /FocusGuardCheckProvider/{p=1} p && /exported/' manifest.txt | grep -q "=true"; then
            echo "::error::Release APK exports Focus Guard's provider"
            exit 1
          fi
          # R8 must keep what WorkManager creates by reflection, or every
          # release process crashes at startup (android/app/proguard-rules.pro).
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$APKANALYZER" dex packages --defined-only "$APK" > dex.txt
          for kept in \
            'androidx.work.impl.WorkDatabase_Impl <init>()' \
            'com.nextrep.nextrep.focusguard.FocusGuardWorker <init>(android.content.Context,androidx.work.WorkerParameters)' \
            'com.nextrep.nextrep.focusguard.FocusGuardCheckProvider <init>()'; do
            if ! grep -qF "$kept" dex.txt; then
              echo "::error::Release APK lost $kept to shrinking"
              exit 1
            fi
          done
