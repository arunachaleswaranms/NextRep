name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only: the workflow never writes to the repository.
permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  quality:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    # 30, not 20: by Phase 12G this job took 19 of its 20 minutes; Phase 12H
    # adds its integration suites (once below, again in "All tests").
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Migration tests (schema v1 -> v2 -> v3 -> v4 -> v5 -> v6 -> v7)
        run: >-
          flutter test
          test/data/migration_test.dart
          test/data/migration_v3_test.dart
          test/data/migration_v4_test.dart
          test/data/migration_v5_test.dart
          test/data/migration_v6_test.dart
          test/data/migration_v7_test.dart

      - name: Backup format tests (write 4; read 1, 2, 3 and 4)
        run: >-
          flutter test
          test/domain/backup_format_test.dart
          test/domain/backup_v2_test.dart
          test/data/backup_restore_test.dart
          test/data/backup_v2_restore_test.dart
          test/data/backup_v3_test.dart
          test/data/backup_v4_test.dart

      - name: Lifecycle foundation tests (day/date mapping, ended Arcs, clock guard)
        run: >-
          flutter test
          test/domain/arc_date_mapping_test.dart
          test/domain/lifecycle_foundation_test.dart
          test/data/lifecycle_storage_test.dart

      - name: Weekly Review tests (Arc weeks, metrics, summaries, XP and day partitions, read-only, routes, layouts)
        run: >-
          flutter test
          test/domain/arc_weeks_test.dart
          test/domain/weekly_review_test.dart
          test/domain/weekly_summary_rules_test.dart
          test/data/weekly_review_rollback_test.dart
          test/features/weekly_review_provider_test.dart
          test/features/weekly_review_read_only_test.dart
          test/features/weekly_review_screen_test.dart
          test/integration/weekly_review_layout_test.dart

      - name: Calendar tests (92 cells in 13 weeks, shared Journey states, pauses, ended Arcs, read-only, zero extra reads, accessibility, layouts)
        run: >-
          flutter test
          test/domain/calendar_state_test.dart
          test/data/calendar_restore_test.dart
          test/features/arc_calendar_test.dart
          test/features/calendar_navigation_test.dart
          test/features/calendar_read_only_test.dart
          test/features/calendar_accessibility_test.dart
          test/integration/calendar_layout_test.dart

      - name: Phase 12D tests (setup ordering transactions, saved setup, start dates, Confirm & Start, read-only, routes, accessibility, contrast, layouts)
        run: >-
          flutter test
          test/data/setup_reorder_test.dart
          test/data/setup_persistence_test.dart
          test/domain/setup_start_test.dart
          test/features/setup_control_flow_test.dart
          test/features/setup_read_only_test.dart
          test/integration/setup_layout_test.dart
          test/app/app_routes_test.dart
          test/app/winter_theme_contrast_test.dart

      - name: Phase 12E2 tests (Freeze and Resume transactions, clock guard, revisions, reminders, backup, flows, read-only, layouts)
        run: >-
          flutter test
          test/data/arc_pause_test.dart
          test/domain/arc_pause_rules_test.dart
          test/features/arc_pause_flow_test.dart
          test/features/arc_pause_read_only_test.dart
          test/integration/pause_layout_test.dart

      - name: Phase 12F tests (Restart and Delete transactions, last lived day, baseline, rollback, generated histories, backup, flows, read-only, layouts)
        run: >-
          flutter test
          test/data/arc_restart_test.dart
          test/data/arc_restart_delete_test.dart
          test/domain/arc_restart_rules_test.dart
          test/features/arc_restart_flow_test.dart
          test/features/arc_restart_read_only_test.dart
          test/integration/restart_layout_test.dart

      - name: Phase 12G tests (completion sounds - throttle, saved-completion triggers, Perfect Day, settings, restore, boundaries, data unchanged, layouts, asset properties, stale requests dropped)
        run: >-
          flutter test
          test/domain/completion_feedback_test.dart
          test/features/completion_sound_flow_test.dart
          test/features/completion_sound_stale_test.dart
          test/features/completion_sound_regression_test.dart
          test/features/sound_settings_test.dart
          test/app/completion_sound_boundary_test.dart
          test/assets/completion_sound_assets_test.dart

      - name: Phase 12H tests (v1.3 features together, cross-screen reconciliation, migration chain, complex backups and genuine legacy files, layouts and guidelines, reduced motion, midnight, destructive announcements, restart on a resume day)
        run: >-
          flutter test
          test/integration/phase12h_combined_flow_test.dart
          test/integration/phase12h_metric_reconciliation_test.dart
          test/integration/phase12h_backup_test.dart
          test/integration/phase12h_layout_test.dart
          test/data/migration_chain_test.dart
          test/data/phase12h_restart_resume_day_test.dart
          test/features/phase12h_midnight_test.dart
          test/features/phase12h_destructive_semantics_test.dart

      # The six bundled sounds are exactly what their committed generator
      # produces (headers byte for byte, samples within 1 LSB).
      - name: Completion sounds reproduce from their source
        run: dart run tool/sounds/generate_completion_sounds.dart --check

      # For the owner's Gate G listening review: the six original files.
      - name: Upload completion sounds for listening
        uses: actions/upload-artifact@v4
        with:
          name: nextrep-completion-sounds
          path: assets/sounds/*.wav
          if-no-files-found: error

      - name: Focus Guard tests (settings, usage, one nudge a day, restore)
        run: >-
          flutter test
          test/domain/focus_guard_test.dart
          test/domain/focus_guard_service_test.dart
          test/data/focus_guard_codec_test.dart
          test/data/focus_guard_persistence_test.dart
          test/features/phase11c_focus_guard_flow_test.dart

      - name: Manual update check tests (versions, release validation, manual-only network)
        run: >-
          flutter test
          test/domain/release_version_test.dart
          test/domain/update_checker_test.dart
          test/data/github_release_feed_test.dart
          test/features/phase11d_about_flow_test.dart
          test/app/network_boundary_test.dart
          test/app/app_routes_test.dart

      - name: Release qualification tests (release identity 1.3.0+4, lifecycle, accessibility, dates)
        run: >-
          flutter test
          test/app/phase12i_release_test.dart
          test/app/phase11f_release_test.dart
          test/app/day_change_test.dart
          test/domain/date_edges_test.dart
          test/features/phase7_lifecycle_test.dart
          test/features/phase7_accessibility_test.dart

      - name: All tests
        run: flutter test

  android:
    name: Android builds and permission audit
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      # A compile check only. The release build type is signed with the
      # runner's throwaway debug key: no signing secret exists in CI, and
      # this artifact is never published.
      - name: Build release APK
        run: flutter build apk --release

      # Native logic on the JVM: Focus Guard's UsageStats event calculation,
      # background check and SQL against a real SQLite with Drift's schema
      # (claims, concurrency, restore); the completion-sound player's
      # loading, playing, silencing and release (Phase 12G).
      - name: Native Android tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Release permission audit
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          # INTERNET is expected (below): only the manual update check uses it.
          for forbidden in SCHEDULE_EXACT_ALARM USE_EXACT_ALARM \
            MANAGE_EXTERNAL_STORAGE READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE \
            READ_MEDIA_IMAGES READ_MEDIA_VIDEO READ_MEDIA_AUDIO READ_MEDIA_VISUAL_USER_SELECTED \
            READ_CONTACTS WRITE_CONTACTS GET_ACCOUNTS CAMERA RECORD_AUDIO \
            QUERY_ALL_PACKAGES SYSTEM_ALERT_WINDOW REQUEST_INSTALL_PACKAGES FOREGROUND_SERVICE \
            ACCESS_NETWORK_STATE; do
            if grep -q "android.permission.$forbidden'" permissions.txt; then
              echo "::error::Release APK requests android.permission.$forbidden"
              exit 1
            fi
          done
          # Exactly the expected set: the manual update check's INTERNET,
          # reminders (boot, vibrate, notifications, the app-private receiver
          # permission), Focus Guard's Usage Access and WorkManager's
          # WAKE_LOCK. Anything else fails.
          sed -nE "s/^uses-permission(-sdk-23)?: name='([^']*)'.*/\2/p" permissions.txt | sort -u > declared.txt
          printf '%s\n' \
            android.permission.INTERNET \
            android.permission.RECEIVE_BOOT_COMPLETED \
            android.permission.VIBRATE \
            android.permission.POST_NOTIFICATIONS \
            android.permission.PACKAGE_USAGE_STATS \
            android.permission.WAKE_LOCK \
            com.nextrep.nextrep.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION | sort -u > expected.txt
          if ! diff expected.txt declared.txt; then
            echo "::error::Release APK permissions differ from the expected set"
            exit 1
          fi
          # No Accessibility, VPN or notification listener service, and no
          # foreground service, may be declared at all.
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          for bind in BIND_ACCESSIBILITY_SERVICE BIND_VPN_SERVICE BIND_NOTIFICATION_LISTENER_SERVICE; do
            if grep -q "android.permission.$bind" manifest.txt; then
              echo "::error::Release APK declares a service guarded by $bind"
              exit 1
            fi
          done
          if grep -qE "SystemForegroundService|foregroundServiceType" manifest.txt; then
            echo "::error::Release APK declares a foreground service"
            exit 1
          fi
          # Official pages open in the user's browser only: url_launcher's
          # in-app WebView is removed.
          if grep -q "WebViewActivity" manifest.txt; then
            echo "::error::Release APK declares an in-app WebView activity"
            exit 1
          fi
          # Focus Guard's background check is there and private.
          if ! grep -q "FocusGuardCheckProvider" manifest.txt; then
            echo "::error::Release APK lacks Focus Guard's background check"
            exit 1
          fi
          if awk '/E: /{p=0} /FocusGuardCheckProvider/{p=1} p && /exported/' manifest.txt | grep -q "=true"; then
            echo "::error::Release APK exports Focus Guard's provider"
            exit 1
          fi
          # R8 must keep what WorkManager creates by reflection, or every
          # release process crashes at startup (android/app/proguard-rules.pro).
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$APKANALYZER" dex packages --defined-only "$APK" > dex.txt
          for kept in \
            'androidx.work.impl.WorkDatabase_Impl <init>()' \
            'com.nextrep.nextrep.focusguard.FocusGuardWorker <init>(android.content.Context,androidx.work.WorkerParameters)' \
            'com.nextrep.nextrep.focusguard.FocusGuardCheckProvider <init>()'; do
            if ! grep -qF "$kept" dex.txt; then
              echo "::error::Release APK lost $kept to shrinking"
              exit 1
            fi
          done

      # SoundPool opens each completion sound with AssetManager.openFd, which
      # only works on entries stored uncompressed. A compressed one would be
      # silently skipped on every phone.
      - name: Completion sounds bundled uncompressed
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -v "$APK" | grep 'assets/flutter_assets/assets/sounds/' | tee sounds.txt
          test "$(grep -c '\.wav$' sounds.txt)" -eq 6
          if grep '\.wav$' sounds.txt | grep -vq ' Stored '; then
            echo "::error::A completion sound is compressed in the release APK"
            exit 1
          fi
